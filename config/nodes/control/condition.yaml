apiVersion: graphiti/v1
kind: NodeDefinition
metadata:
  id: control-condition
  name: Condition
  description: "Routes data based on a boolean expression"
  version: "1.0.0"
  icon: "?"
category:
  group: Control
  order: 10
shape:
  type: diamond
  width: 160
  minWidth: 120
  maxWidth: 240
  headerColor: "var(--yellow)"
  headerBackground: "var(--yellow-dim)"
ports:
  inputs:
    - id: in-main
      label: "Input"
      type: data
      position: left-center
      maxConnections: 1
  outputs:
    - id: out-true
      label: "True"
      type: control
      position: right-top
      maxConnections: -1
    - id: out-false
      label: "False"
      type: control
      position: right-bottom
      maxConnections: -1
attributes:
  - id: expression
    label: "Expression"
    type: expression
    required: true
    display: node-body
    group: "Logic"
    hint: "Boolean expression to evaluate (e.g., data.status == 'success')"
validation:
  connectionRules:
    - outputPort: out-true
      allowedTargetCategories: ["Processing", "Destinations", "Control"]
      allowedTargetPorts: ["data", "control"]
    - outputPort: out-false
      allowedTargetCategories: ["Processing", "Destinations", "Control"]
      allowedTargetPorts: ["data", "control"]
