<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphiti Canvas - Web Component Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; font-weight: 500; }
    .toolbar input, .toolbar select {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    .toolbar input { min-width: 200px; }
    .toolbar button {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    .toolbar button:hover { background: #f5f5f5; }
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .canvas-panel {
      flex: 1;
      position: relative;
    }
    graphiti-canvas {
      width: 100%;
      height: 100%;
    }
    .event-log {
      width: 300px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: monospace;
      font-size: 12px;
      overflow-y: auto;
      padding: 12px;
      border-left: 1px solid #333;
    }
    .event-log h3 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #89b4fa;
    }
    .event-entry {
      margin-bottom: 6px;
      padding: 4px 6px;
      background: #313244;
      border-radius: 4px;
      word-break: break-all;
    }
    .event-name { color: #a6e3a1; font-weight: bold; }
    .event-time { color: #6c7086; font-size: 10px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>API URL:</label>
    <input id="api-url" type="text" value="http://localhost:8080" />
    <label>Token:</label>
    <input id="token" type="text" value="dev-token" />
    <label>Workflow:</label>
    <select id="workflow-select">
      <option value="">-- Select --</option>
    </select>
    <button id="load-btn">Load Workflows</button>
    <button id="theme-btn">Toggle Theme</button>
    <button id="fit-btn">Zoom to Fit</button>
  </div>
  <div class="main">
    <div class="canvas-panel">
      <graphiti-canvas
        id="canvas"
        api-url="http://localhost:8080"
        token="dev-token"
        theme="light"
      ></graphiti-canvas>
    </div>
    <div class="event-log" id="event-log">
      <h3>Event Log</h3>
    </div>
  </div>

  <script type="module" src="./demo.ts"></script>
</body>
</html>
