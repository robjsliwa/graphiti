    <path d="M 165 315 L 140 340 L 175 350" stroke="url(#grad3)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <path d="M 250 250 C 280 300, 310 330, 340 360" stroke="url(#grad1)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 315 365 L 340 360 L 325 335" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

