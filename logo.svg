    <circle cx="120" cy="150" r="25" fill="url(#grad1)" />
    <circle cx="115" cy="185" r="5" fill="url(#grad1)" /> <circle cx="115" cy="200" r="2" fill="url(#grad1)" /> <circle cx="380" cy="160" r="30" fill="url(#grad2)" />
    <circle cx="380" cy="200" r="6" fill="url(#grad2)" />
    <circle cx="380" cy="215" r="3" fill="url(#grad2)" />

    <circle cx="140" cy="340" r="20" fill="url(#grad3)" />
