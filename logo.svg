    <circle cx="240" cy="325" r="4" fill="url(#gradCenter)" />
    <circle cx="265" cy="310" r="5" fill="url(#gradCenter)" />

    </g>

  <g fill="none" stroke="rgba(255,255,255,0.5)" stroke-linecap="round">
