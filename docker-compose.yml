services:
  graphiti:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SESSION_SECRET=docker-dev-secret-change-in-prod
      - DEPLOY_HMAC_SECRET=shared-hmac-secret
      - DEPLOY_WEBHOOK_PROD=http://engine:9090/deploy
      - DEPLOY_WEBHOOK_STAGING=http://engine:9090/deploy
    volumes:
      - graphiti-data:/data
    depends_on:
      - engine

  engine:
    build:
      context: ./examples/engine
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - DATABASE_URL=postgres://graphiti:graphiti@postgres:5432/graphiti?sslmode=disable
      - GRAPHITI_CALLBACK_URL=http://graphiti:8080/api/callbacks/execution
      - DEPLOY_HMAC_SECRET=shared-hmac-secret
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=graphiti
      - POSTGRES_PASSWORD=graphiti
      - POSTGRES_DB=graphiti
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphiti"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  graphiti-data:
  postgres-data:
